<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0e4d2e">
  <link rel="icon" type="image/svg+xml" href="assets/card-back.svg">
  <title>UNO 单机版</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/effects.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="lobby-screen" class="screen" data-screen="lobby" aria-labelledby="lobby-title">
      <div class="lobby-shell">
        <div class="lobby-brand">
          <img class="lobby-mark" src="assets/card-back.svg" width="120" height="180" alt="UNO 卡背">
          <h1 id="lobby-title">UNO 单机版</h1>
          <p>个人练习项目，非官方</p>
        </div>
        <div class="lobby-panel" id="single-panel">
          <form id="lobby-form" class="lobby-form">
            <div class="form-grid">

              <div class="form-field full">
                <span class="field-label">对战人数</span>
                <div id="player-count-options" class="choice-grid" role="group" aria-label="对战人数"></div>
              </div>
              <div class="form-field">
                <span class="field-label">AI 难度</span>
                <div id="difficulty-options" class="choice-grid" role="group" aria-label="AI 难度"></div>
              </div>
              <div class="form-field">
                <span class="field-label">AI 模式</span>
                <div id="ai-mode-options" class="choice-grid three" role="group" aria-label="AI 模式"></div>
              </div>
              <div class="form-field full">
                <span class="field-label">规则选项</span>
                <label class="rule-toggle" for="challenge-wild4">
                  <input id="challenge-wild4" name="challengeWild4" type="checkbox" checked>
                  <span class="rule-toggle-text">
                    <strong>+4 挑战</strong>
                    <small id="challenge-wild4-hint">开启：被 +4 指向的玩家可选择「挑战」或「摸 4 张」；关闭：+4 直接摸 4 张</small>
                  </span>
                </label>
              </div>
            </div>
            <div class="lobby-actions">
              <button class="btn btn-primary btn-large" type="submit" aria-label="开始游戏">开始游戏</button>
              <button class="btn btn-ghost" type="button" data-open-dialog="settings" aria-label="设置">设置</button>
              <button class="btn btn-ghost" type="button" data-open-dialog="stats" aria-label="战绩">战绩</button>
            </div>
          </form>
          <div class="online-block" id="online-block">
            <div class="online-divider"><span>局域网联机</span></div>
            <div class="online-grid">
              <input id="online-name" type="text" maxlength="12" placeholder="显示名（默认：你）" aria-label="显示名" autocomplete="off">
              <input id="online-code" type="text" maxlength="6" placeholder="房间码" aria-label="房间码" autocomplete="off">
            </div>
            <div class="online-actions">
              <button id="online-create" class="btn" type="button" aria-label="创建房间">创建房间</button>
              <button id="online-join" class="btn" type="button" aria-label="加入房间">加入房间</button>
            </div>
            <div class="online-manual" id="online-manual" hidden>
              <input id="online-host" type="text" placeholder="主机 IP:端口（发现失败时手动填写，如 192.168.1.5:51234）" aria-label="主机地址" autocomplete="off" spellcheck="false">
            </div>
            <div class="online-host-choice" id="online-host-choice" hidden></div>
            <div class="online-discovered" id="online-discovered" hidden>
              <p class="online-discovered-title">附近房间</p>
              <ul id="online-room-list" class="online-room-list"></ul>
            </div>
          </div>
        </div>
        <div class="lobby-panel" id="room-panel" hidden>
          <div class="room-box">
            <h2 class="room-title">联机房间</h2>
            <p class="room-code-line">房间码 <strong id="room-code">------</strong></p>
            <p class="room-tip">把房间码告诉同一局域网的好友，一起加入</p>
            <div class="room-name-edit">
              <input id="room-name-input" maxlength="8" placeholder="你的名字" aria-label="你的名字">
              <button id="room-name-save" class="btn btn-ghost" type="button" aria-label="改名">改名</button>
            </div>
            <ul id="room-players" class="room-players"></ul>
            <div class="room-ai-row" id="room-ai-row" hidden>
              <label for="room-ai-count">AI 补位</label>
              <select id="room-ai-count"></select>
            </div>
            <p id="room-status" class="room-status"></p>
            <p id="room-invite" class="room-invite" hidden></p>
        <p id="room-host-info" class="room-host-info" hidden></p>
            <div class="room-emote-row">
              <button id="room-emote-toggle" class="btn btn-ghost" type="button" aria-label="发送表情" hidden>表情</button>
            </div>
            <div class="lobby-actions">
              <button id="room-start" class="btn btn-primary" type="button" aria-label="开始游戏" hidden>开始游戏</button>
              <button id="room-leave" class="btn btn-ghost" type="button" aria-label="离开房间">离开房间</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen" data-screen="game" aria-label="牌桌">
      <header id="top-bar">
        <div class="top-status">
          <span class="status-chip status-color"><span id="color-indicator" class="color-dot" data-color="red" aria-hidden="true"></span><strong>当前颜色</strong><span id="color-label">红</span></span>
          <span class="status-chip"><span id="direction-indicator" data-direction="1" aria-label="顺时针">↻</span><span id="direction-label">顺时针</span></span>
          <span class="status-chip"><strong>AI</strong><span id="ai-mode-indicator">自动</span></span>
        </div>
        <div class="top-actions">
          <button id="game-emote-toggle" class="btn btn-ghost" type="button" aria-label="发送表情" hidden>表情</button>
          <button class="btn btn-ghost" type="button" data-open-dialog="settings" aria-label="设置">设置</button>
          <button id="quit-game" class="btn btn-danger" type="button" aria-label="退出对局">退出</button>
        </div>
      </header>

      <div id="table-area">
        <div id="opponents" aria-label="AI 玩家"></div>
        <div id="table-center" aria-label="牌堆">
          <div id="color-glow" data-color="red" aria-hidden="true"></div>
          <span id="table-direction" aria-label="顺时针">↻</span>
          <div class="pile-stack">
            <div id="draw-pile" data-count="41" aria-label="抽牌堆"></div>
            <span id="draw-count" class="pile-count">41</span>
          </div>
          <div class="pile-stack">
            <div id="discard-pile" data-top-card="R3" aria-label="弃牌堆"></div>
            <span id="stack-badge" data-total="" hidden></span>
          </div>
        </div>
        <div id="event-feed" aria-live="polite"></div>
        <div id="speech-layer" aria-live="polite"></div>
        <!-- M5-01：人类挑战 AI 成功时展示对方手牌 2~3 秒（由 js/ui/challengeReveal.js 控制显隐） -->
        <div id="challenge-reveal" class="challenge-reveal" hidden aria-live="polite" aria-label="挑战查看手牌">
          <div class="challenge-reveal-card">
            <strong id="challenge-reveal-title"></strong>
            <div id="challenge-reveal-hand" class="challenge-reveal-hand"></div>
            <span id="challenge-reveal-count" class="challenge-reveal-count"></span>
          </div>
        </div>
      </div>

      <div id="hand-zone">
        <div id="hand" data-seat="0" aria-label="你的手牌"></div>
        <div id="action-bar" aria-label="可用操作"></div>
        <div id="hint-bar" role="status"></div>
      </div>
    </section>

    <section id="result-screen" class="screen" data-screen="result" aria-labelledby="result-title">
      <div class="result-panel">
        <div id="result-content"></div>
      </div>
    </section>
  </main>
  <div id="emote-picker" role="group" aria-label="选择表情" hidden></div>
  <div id="dialog-root" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <div id="effect-layer" aria-hidden="true"></div>
  <div id="dev-toolbar" class="dev-toolbar" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
